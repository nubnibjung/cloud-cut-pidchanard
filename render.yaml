services:
  - type: web
    name: cloudcut-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: API_ADDR
        value: 0.0.0.0:10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PUBLIC_BASE_URL
        value: https://cloudcut-backend.onrender.com/uploads
      # Cloudflare R2 for uploads and exports (Render's own disk is wiped on every
      # deploy/restart). Without all five, files fall back to that disk.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Render exports at 720p: 1080p runs the 512 MB free instance out of memory
      - key: EXPORT_HEIGHT
        value: "720"
      - key: RUST_LOG
        value: backend=info,tower_http=info

  - type: web
    name: cloudcut-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        value: https://cloudcut-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
