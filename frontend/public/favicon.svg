<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Snipline mark: two offset clip bars snipped by a diagonal cut -->
  <rect width="32" height="32" rx="8" fill="#081113"/>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <path d="M20.5 4.5 11.5 27.5" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>
  </mask>
  <g mask="url(#cut)" fill="#2bd4c8">
    <rect x="3" y="7.5" width="18" height="7" rx="3.5"/>
    <rect x="11" y="17.5" width="18" height="7" rx="3.5"/>
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#2bd4c8" opacity="0.55"/>
</svg>
