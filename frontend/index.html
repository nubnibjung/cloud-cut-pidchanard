<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081113" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Snipline — edit video together, right in your browser." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='#081113'/%3E%3Cmask id='m' maskUnits='userSpaceOnUse' x='0' y='0' width='32' height='32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Cpath d='M20.5 4.5 11.5 27.5' stroke='black' stroke-width='3.2' stroke-linecap='round'/%3E%3C/mask%3E%3Cg mask='url(#m)' fill='#2bd4c8'%3E%3Crect x='3' y='7.5' width='18' height='7' rx='3.5'/%3E%3Crect x='11' y='17.5' width='18' height='7' rx='3.5'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='1.6' fill='#2bd4c8' opacity='0.55'/%3E%3C/svg%3E"
    />
    <title>Snipline</title>
    <script>
      // Pick the theme before first paint so a light-mode page never flashes dark
      (function () {
        try {
          var pref = localStorage.getItem('cc_theme') || 'dark';
          var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #081113;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f0f7f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
