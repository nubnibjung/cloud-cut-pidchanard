<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081113" />
    <meta name="color-scheme" content="dark" />
    <title>Snipline – Collaborative Online Video Editor in Your Browser</title>
    <meta
      name="description"
      content="Snipline is a fast, collaborative video editor that runs in your browser. Upload clips, cut on a multi-track timeline, add effects and export MP4."
    />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Snipline" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Social previews (Facebook, LINE, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Snipline" />
    <meta property="og:title" content="Snipline – Collaborative Online Video Editor in Your Browser" />
    <meta
      property="og:description"
      content="Edit video together, right in your browser: upload clips, cut on a multi-track timeline, add effects and export MP4."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Snipline logo and a video timeline with clips on three tracks" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:title" content="Snipline – Collaborative Online Video Editor in Your Browser" />
    <meta
      name="twitter:description"
      content="Edit video together, right in your browser: upload clips, cut on a multi-track timeline, add effects and export MP4."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <script>
      // Pick the theme before first paint so a light-mode page never flashes dark
      (function () {
        try {
          var pref = localStorage.getItem('cc_theme') || 'dark';
          var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #081113;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f0f7f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
